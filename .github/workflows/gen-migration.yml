# مؤقت: بيولّد ملف الهجرة الأولى (InitialSchema) على أجهزة جيت هاب لأن ما في أدوات دوت نت على جهاز المالك.
# بيشتغل مرة وحدة على الفرع step-02-db وبيرجع commit فيه الملفات، وبعدها بنحذفه.
name: Generate migration

on:
  push:
    branches: [step-02-db]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool install --global dotnet-ef --version 8.0.10
      - name: Generate InitialSchema
        working-directory: backend
        run: |
          set -eu
          if ls src/ZakiSocial.Data/Migrations/*_InitialSchema.cs > /dev/null 2>&1; then
            echo "InitialSchema already exists"; exit 0
          fi
          dotnet ef migrations add InitialSchema \
            --project src/ZakiSocial.Data --startup-project src/ZakiSocial.Api \
            --output-dir Migrations
          # رقم ثابت يسبق هجرة العزل (20261104000002)
          cd src/ZakiSocial.Data/Migrations
          for f in *_InitialSchema.cs *_InitialSchema.Designer.cs; do
            ts=${f%%_*}
            new=${f/$ts/20261104000001}
            git mv -f "$f" "$new" 2>/dev/null || mv "$f" "$new"
            sed -i "s/$ts/20261104000001/g" "$new"
          done
          sed -i "s/$ts/20261104000001/g" *ModelSnapshot.cs || true
          ls -la
      - name: Commit
        run: |
          set -eu
          if [ -z "$(git status --porcelain)" ]; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "هجرة InitialSchema مولّدة تلقائياً"
          git push
