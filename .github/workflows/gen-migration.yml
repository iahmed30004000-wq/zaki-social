# بيولّد ملف الهجرة تلقائياً لما يتغير شكل الجداول بالكود (ما في أدوات دوت نت على جهاز المالك).
# بيشتغل على أي فرع اسمه يبدأ بـ step- ، وبس لو بالفعل في تغييرات جداول بدون هجرة.
# اسم الهجرة من الملف backend/.migration-name (سطر وحيد). الـ commit اللي بيرجعه ما بيشغّل فحوصات الدمج،
# فبعده لازم يندفع commit عادي (مثلاً حذف الملف) ليشتغل الفحص.
name: Generate migration

on:
  push:
    branches: ['step-*']
    paths: ['backend/src/**', 'backend/.migration-name']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool install --global dotnet-ef --version 8.0.10
      - name: Generate if the model changed
        working-directory: backend
        run: |
          set -eu
          export PATH="$PATH:$HOME/.dotnet/tools"
          if dotnet ef migrations has-pending-model-changes --project src/ZakiSocial.Data --startup-project src/ZakiSocial.Api; then
            echo "no pending model changes"; exit 0
          fi
          name=$(cat .migration-name 2>/dev/null || echo AutoMigration)
          dotnet ef migrations add "$name" \
            --project src/ZakiSocial.Data --startup-project src/ZakiSocial.Api \
            --output-dir Migrations
          python3 ../scripts/add_rls_to_migration.py src/ZakiSocial.Data/Migrations/*_$name.cs
      - name: Commit
        run: |
          set -eu
          if [ -z "$(git status --porcelain)" ]; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "هجرة مولّدة تلقائياً"
          git push
