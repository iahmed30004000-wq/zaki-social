# بيبني صورتي الخادم الخلفي والواجهة على أجهزة جيت هاب (مش على السيرفر)، وبيجرّبهم فعلياً،
# وبس على الفرع الرئيسي بينشرهم بجيت هاب GHCR وبيبلّغ كوليفاي ينزّل الجديد.
# على طلب الدمج: بيبني ويجرّب ولا بينشر شي. اسم المهمة "image" هو الفحص الإلزامي للدمج التلقائي.
name: Image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # قاعدة بيانات وريديس حقيقيين للتجربة، بيننحذفوا بآخر المهمة.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke-test-password-not-used-anywhere
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: أسماء الصور
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/$owner/zaki-social-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$owner/zaki-social-frontend" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # لو حدا غيّر الجداول بالكود بدون هجرة جديدة، الفحص بيفشل.
      - name: الجداول بالكود متطابقة مع ملفات الهجرة؟
        working-directory: backend
        run: |
          set -eu
          dotnet tool install --global dotnet-ef --version 8.0.10
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes             --project src/ZakiSocial.Data --startup-project src/ZakiSocial.Api

      - uses: docker/setup-buildx-action@v3

      # كل الصور الخارجية اللي بتحتاجها ملفات الدوكر لازم تكون موجودة وقابلة للسحب (صورة minio الرسمية انسحبت مرة).
      - name: صور الملفات موجودة؟
        env:
          SERVICE_PASSWORD_POSTGRES: ci-not-a-secret
          SERVICE_USER_MINIO: ci-not-a-secret
          SERVICE_PASSWORD_MINIO: ci-not-a-secret
        run: |
          set -eu
          for f in docker-compose.yml docker-compose.prod.yml; do
            for img in $(docker compose -f "$f" config --images); do
              case "$img" in
                ghcr.io/*|zaki-social-*) continue ;;
              esac
              echo "فحص $img"
              docker manifest inspect "$img" > /dev/null
            done
          done

      - name: بناء الخادم الخلفي
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: zaki-backend:smoke
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: بناء الواجهة
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: zaki-frontend:smoke
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: تخزين الملفات (MinIO تجريبي)
        run: |
          docker run -d --name minio --network host -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-password-not-used chainguard/minio:latest server /tmp/data --address :9000
          for _ in $(seq 1 40); do curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null && break; sleep 1; done

      - name: خادم المنصات التجريبي (بدل فيسبوك الحقيقي)
        run: |
          nohup python3 scripts/fake_platforms.py 9090 > /tmp/fake_platforms.log 2>&1 &
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:9090/__requests > /dev/null && break; sleep 0.5; done

      - name: تشغيل الاثنين والتأكد إنهم سليمين
        run: |
          set -eu
          docker run -d --name backend --network host \
            -e 'ConnectionStrings__Postgres=Host=127.0.0.1;Port=5432;Database=smoke;Username=smoke;Password=smoke-test-password-not-used-anywhere;Timeout=3;Command Timeout=3' \
            -e 'Redis__ConnectionString=127.0.0.1:6379' \
            -e 'Database__AutoMigrate=true' \
            -e 'Jwt__Key=ci-only-signing-key-not-used-anywhere-0123456789' \
            -e 'Encryption__Key=ci-only-encryption-key-not-used-anywhere-0123456789' \
            -e 'App__PublicUrl=http://127.0.0.1:8080' \
            -e 'Workers__RetryDelaysSeconds=1,1' \
            -e 'Storage__Endpoint=http://127.0.0.1:9000' -e 'Storage__AccessKey=ci-minio' -e 'Storage__SecretKey=ci-minio-password-not-used' -e 'Storage__Bucket=zaki-media' \
            -e 'Ai__Claude__ApiKey=ci-claude-key' -e 'Ai__Claude__Model=claude-ci' -e 'Ai__Claude__BaseUrl=http://127.0.0.1:9090/claude' \
            -e 'Ai__OpenAi__ApiKey=ci-openai-key' -e 'Ai__OpenAi__Model=gpt-ci' -e 'Ai__OpenAi__BaseUrl=http://127.0.0.1:9090/openai' \
            -e 'Ai__Local__Model=local-ci' -e 'Ai__Local__BaseUrl=http://127.0.0.1:9090/local' \
            -e 'Ai__MonthlyTokenLimit=2000' \
            -e 'Facebook__AppId=ci-app-id' \
            -e 'Facebook__AppSecret=ci-app-secret' \
            -e 'Facebook__GraphBase=http://127.0.0.1:9090' \
            -e 'Facebook__DialogBase=https://facebook.test/dialog/oauth' \
            -e 'ASPNETCORE_URLS=http://+:8080' \
            zaki-backend:smoke
          docker run -d --name frontend --network host zaki-frontend:smoke

          wait_healthy() {
            status=starting
            for _ in $(seq 1 30); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$1" 2>/dev/null || echo gone)
              [ "$status" = healthy ] && return 0
              [ "$status" = gone ] && break
              sleep 5
            done
            echo "::error::$1 is not healthy (status: $status)"
            docker logs "$1" 2>&1 | tail -60 || true
            return 1
          }
          wait_healthy backend
          wait_healthy frontend

          body=$(curl -fsS http://127.0.0.1:8080/api/health)
          echo "$body"
          echo "$body" | grep -q '"database":"ok"' || { echo "::error::database is not ok"; exit 1; }
          echo "$body" | grep -q '"redis":"ok"' || { echo "::error::redis is not ok"; exit 1; }

          page=$(curl -fsS http://127.0.0.1:3000/)
          echo "$page" | grep -q 'dir="rtl"' || { echo "::error::landing page is not RTL"; exit 1; }

      - name: النشر عبر الطابور (ريديس + عامل) مع إعادة المحاولة
        run: bash scripts/ci-publish-check.sh http://127.0.0.1:8080 http://127.0.0.1:9090

      - name: موجّه الذكاء الاصطناعي (توجيه، تحويل تلقائي، بيانات حسّاسة، حد الاستهلاك)
        run: bash scripts/ci-ai-check.sh http://127.0.0.1:8080

      - name: مركز البرومبتات والاعتماد البشري
        run: bash scripts/ci-prompts-check.sh http://127.0.0.1:8080 http://127.0.0.1:9090

      - name: الجدولة والتقويم وأفضل وقت
        run: bash scripts/ci-schedule-check.sh http://127.0.0.1:8080 http://127.0.0.1:9090

      - name: الوسائط (رفع، معالجة FFmpeg، نشر صور وفيديو)
        run: bash scripts/ci-media-check.sh http://127.0.0.1:8080 http://127.0.0.1:9090

      - name: ربط فيسبوك وتشفير التوكنات (مع خادم تجريبي)
        env:
          PGHOST: 127.0.0.1
        run: bash scripts/ci-accounts-check.sh http://127.0.0.1:8080 http://127.0.0.1:9090

      - name: الدخول والصلاحيات وعزل المساحات (تسجيل حقيقي عبر الخادم)
        run: bash scripts/ci-auth-check.sh http://127.0.0.1:8080

      - name: الجداول وعزل المساحات (على قاعدة حقيقية)
        env:
          PGHOST: 127.0.0.1
          PGUSER: smoke
          PGPASSWORD: smoke-test-password-not-used-anywhere
          PGDATABASE: smoke
        run: |
          set -eu
          q() { psql -q -v ON_ERROR_STOP=1 -tA "$@"; }
          fail() { echo "::error::$1"; exit 1; }

          tables=$(q -c "select count(*) from information_schema.tables where table_schema='public' and table_name in ('workspaces','users','memberships','social_accounts','posts','post_targets','media_assets','prompts','prompt_versions','analytics_snapshots','proxies','responder_rules','collected_data','app_logs','settings')")
          [ "$tables" = 15 ] || fail "expected 15 tables, found $tables"

          rls=$(q -c "select count(*) from pg_tables where schemaname='public' and rowsecurity and tablename <> 'workspaces'")
          withws=$(q -c "select count(*) from information_schema.columns where table_schema='public' and column_name='workspace_id' and table_name <> 'refresh_tokens'")
          [ "$rls" = "$withws" ] || fail "every table with workspace_id needs row level security ($rls of $withws)"

          tok=$(q -c "select count(*) from information_schema.columns where table_name='social_accounts' and column_name in ('enc_access_token','enc_refresh_token') and data_type='bytea'")
          [ "$tok" = 2 ] || fail "token columns must be bytea"

          A=aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
          B=bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb
          q -c "insert into workspaces(id,name) values ('$A','A'),('$B','B'); insert into posts(workspace_id,body) values ('$A','post a'),('$B','post b');"

          as_app() {
            printf "begin;\nset local role zaki_app;\nselect set_config('app.workspace_id','%s',true) is not null;\n%s;\ncommit;\n" "$1" "$2" | psql -q -v ON_ERROR_STOP=1 -tA
          }

          [ "$(as_app "$A" "select body from posts" | tail -1)" = "post a" ] || fail "workspace A must see only its own post"
          [ "$(as_app "$B" "select body from posts" | tail -1)" = "post b" ] || fail "workspace B must see only its own post"
          [ "$(as_app "" "select count(*) from posts" | tail -1)" = 0 ] || fail "no workspace set must see nothing"
          if as_app "$A" "insert into posts(workspace_id,body) values ('$B','sneaky')" > /dev/null 2>&1; then
            fail "workspace A must not write into workspace B"
          fi
          if as_app "$A" "select password_hash from users" > /dev/null 2>&1; then
            fail "app role must not read password_hash"
          fi

          q -c "delete from workspaces where id in ('$A','$B')"
          echo "tables ok, row level security ok"

      - name: إيقاف الحاويات
        if: always()
        run: docker rm -f backend frontend minio 2>/dev/null || true

      # من هون وتحت: بس على الفرع الرئيسي.
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # بننشر نفس الصورة اللي جرّبناها (مش بناء ثاني).
      - name: نشر الصورتين
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          for pair in "backend:${{ steps.image.outputs.backend }}" "frontend:${{ steps.image.outputs.frontend }}"; do
            local_name=${pair%%:*}
            target=${pair#*:}
            docker tag "zaki-$local_name:smoke" "$target:${{ steps.image.outputs.tag }}"
            docker tag "zaki-$local_name:smoke" "$target:main"
            docker push "$target:${{ steps.image.outputs.tag }}"
            docker push "$target:main"
          done

      # يبلّغ كوليفاي. بيتخطى بصمت لحد ما يتحط السرّين بإعدادات المستودع.
      - name: إبلاغ كوليفاي
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -eu
          if [ -z "${COOLIFY_WEBHOOK_URL:-}" ] || [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "COOLIFY_WEBHOOK_URL / COOLIFY_TOKEN غير موجودين - كوليفاي ما انبلّغ."
            exit 0
          fi
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK_URL" > /dev/null
          echo "كوليفاي انبلّغ ينزّل ${{ steps.image.outputs.tag }}"
