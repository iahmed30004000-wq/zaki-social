# للسيرفر (كوليفاي): بيسحب الصور الجاهزة اللي بناها جيت هاب، ما بيبني شي على السيرفر.
# القيمتين POSTGRES_PASSWORD و MINIO_ROOT_PASSWORD إلزاميتين (بتتحط بكوليفاي، مش بالملف).
# كوليفاي بيعطي النطاق للخدمة caddy على المنفذ 80 وبيتولى HTTPS لحاله.
name: zaki-social

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaki
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: zaki_social
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaki -d zaki_social"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    # صورة minio/minio الرسمية انسحبت من دوكر هب، فهي بديل مفتوح ومتوافق
    image: chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
    volumes:
      - miniodata:/data

  backend:
    image: ghcr.io/iahmed30004000-wq/zaki-social-backend:main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=zaki_social;Username=zaki;Password=${SERVICE_PASSWORD_POSTGRES};Timeout=3;Command Timeout=3
      Redis__ConnectionString: redis:6379
      Database__AutoMigrate: "true"
      Security__AuditEndpoints: "true"
      Jwt__Key: ${SERVICE_PASSWORD_64_JWT}
      Encryption__Key: ${SERVICE_PASSWORD_64_ENC}
      App__PublicUrl: ${APP_PUBLIC_URL:-https://social.zakiai.io}
      Facebook__AppId: ${FACEBOOK_APP_ID:-}
      Facebook__AppSecret: ${FACEBOOK_APP_SECRET:-}
      TikTok__ClientKey: ${TIKTOK_CLIENT_KEY:-}
      TikTok__ClientSecret: ${TIKTOK_CLIENT_SECRET:-}
      X__ClientId: ${X_CLIENT_ID:-}
      X__ClientSecret: ${X_CLIENT_SECRET:-}
      YouTube__ClientId: ${YOUTUBE_CLIENT_ID:-}
      YouTube__ClientSecret: ${YOUTUBE_CLIENT_SECRET:-}
      LinkedIn__ClientId: ${LINKEDIN_CLIENT_ID:-}
      LinkedIn__ClientSecret: ${LINKEDIN_CLIENT_SECRET:-}
      TikTok__PrivacyLevel: ${TIKTOK_PRIVACY_LEVEL:-SELF_ONLY}
      YouTube__Privacy: ${YOUTUBE_PRIVACY:-public}
      Ai__OpenAi__ImageModel: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      Ai__Claude__ApiKey: ${ANTHROPIC_API_KEY:-}
      Ai__Claude__Model: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      Ai__OpenAi__ApiKey: ${OPENAI_API_KEY:-}
      Ai__OpenAi__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      Ai__OpenAi__Model: ${OPENAI_MODEL:-gpt-4o}
      Ai__Local__BaseUrl: ${LOCAL_LLM_ENDPOINT:-}
      Ai__Local__Model: ${LOCAL_LLM_MODEL:-}
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${SERVICE_USER_MINIO}
      Storage__SecretKey: ${SERVICE_PASSWORD_MINIO}
      Storage__Bucket: zaki-media

  # نسخ احتياطي يومي: القاعدة (pg_dump) وملفات الوسائط (tar). الاحتفاظ بآخر 14 يوم للقاعدة و7 للوسائط.
  # النسخ على وحدة التخزين backups بنفس السيرفر: انسخها لمكان تاني (راجع docs/DEPLOY_AR.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: zaki
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      PGDATABASE: zaki_social
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - backups:/backups
      - miniodata:/media:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          d=$$(date -u +%Y%m%d-%H%M%S)
          pg_dump -Fc -f /backups/db-$$d.dump
          tar -czf /backups/media-$$d.tar.gz -C /media .
          find /backups -name 'db-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          find /backups -name 'media-*.tar.gz' -mtime +7 -delete
          echo "backup done $$d"
          sleep 86400
        done

  frontend:
    image: ghcr.io/iahmed30004000-wq/zaki-social-frontend:main
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    expose:
      - "80"
    # الإعداد مكتوب هون مباشرة بدل ملف خارجي: كوليفاي ما بينسخ ملفات المستودع للسيرفر.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/caddy/Caddyfile <<'EOF'
        {
          auto_https off
          servers {
            trusted_proxies static private_ranges
          }
        }
        :80 {
          header Strict-Transport-Security "max-age=31536000"
          handle /api/* {
            reverse_proxy backend:8080
          }
          handle {
            reverse_proxy frontend:3000
          }
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  pgdata:
  redisdata:
  miniodata:
  backups:
