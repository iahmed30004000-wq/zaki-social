# للتشغيل المحلي والتجربة: docker compose up --build
# كلمات السر الافتراضية هون للتجربة المحلية فقط. على السيرفر استعمل docker-compose.prod.yml.
name: zaki-social

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zaki_local_dev_only}
      POSTGRES_DB: zaki_social
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaki -d zaki_social"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # صورة minio/minio الرسمية انسحبت من دوكر هب، فهي بديل مفتوح ومتوافق
    image: chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zaki_minio_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zaki_minio_local_dev_only}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=zaki_social;Username=zaki;Password=${POSTGRES_PASSWORD:-zaki_local_dev_only};Timeout=3;Command Timeout=3
      Redis__ConnectionString: redis:6379
      Database__AutoMigrate: "true"
      Jwt__Key: ${JWT_KEY:-zaki-local-dev-only-signing-key-0123456789abcdef}
      Encryption__Key: ${ENCRYPTION_KEY:-zaki-local-dev-only-encryption-key-0123456789abcdef}
      App__PublicUrl: ${APP_PUBLIC_URL:-https://localhost}
      Facebook__AppId: ${FACEBOOK_APP_ID:-}
      Facebook__AppSecret: ${FACEBOOK_APP_SECRET:-}
      TikTok__ClientKey: ${TIKTOK_CLIENT_KEY:-}
      TikTok__ClientSecret: ${TIKTOK_CLIENT_SECRET:-}
      X__ClientId: ${X_CLIENT_ID:-}
      X__ClientSecret: ${X_CLIENT_SECRET:-}
      YouTube__ClientId: ${YOUTUBE_CLIENT_ID:-}
      YouTube__ClientSecret: ${YOUTUBE_CLIENT_SECRET:-}
      LinkedIn__ClientId: ${LINKEDIN_CLIENT_ID:-}
      LinkedIn__ClientSecret: ${LINKEDIN_CLIENT_SECRET:-}
      TikTok__PrivacyLevel: ${TIKTOK_PRIVACY_LEVEL:-SELF_ONLY}
      YouTube__Privacy: ${YOUTUBE_PRIVACY:-public}
      Ai__OpenAi__ImageModel: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      Ai__Claude__ApiKey: ${ANTHROPIC_API_KEY:-}
      Ai__Claude__Model: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      Ai__OpenAi__ApiKey: ${OPENAI_API_KEY:-}
      Ai__OpenAi__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      Ai__OpenAi__Model: ${OPENAI_MODEL:-gpt-4o}
      Ai__Local__BaseUrl: ${LOCAL_LLM_ENDPOINT:-}
      Ai__Local__Model: ${LOCAL_LLM_MODEL:-}
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:-zaki_minio_dev}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-zaki_minio_local_dev_only}
      Storage__Bucket: zaki-media

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
